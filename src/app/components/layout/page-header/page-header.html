<header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
  <div>
    <h1 class="font-display text-3xl font-bold tracking-wide text-gold-400">{{ title() }}</h1>
    @if (description()) {
      <p class="mt-1 max-w-2xl text-muted">{{ description() }}</p>
    }
  </div>
  @if (count() !== null) {
    <p
      class="w-fit rounded-full border border-line bg-space-800 px-4 py-1 text-sm text-muted"
      aria-live="polite"
    >
      <span class="font-semibold text-ink">{{ count() }}</span>
      {{ count() === 1 ? 'result' : 'results' }}
    </p>
  }
</header>
