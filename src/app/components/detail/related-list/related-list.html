<section [attr.aria-labelledby]="headingId()" class="flex flex-col gap-3">
  <h2 [id]="headingId()" class="font-display text-xl font-semibold">{{ heading() }}</h2>
  @if (items().length > 0) {
    <ul class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of items(); track item.link.join('/')) {
        <li>
          <a
            [routerLink]="item.link"
            class="flex h-full min-h-14 flex-col justify-center rounded-card border border-line bg-space-800 px-4 py-3 transition-colors hover:border-gold-500 hover:bg-space-700"
          >
            <span class="font-semibold text-gold-300">{{ item.label }}</span>
            <span class="text-sm text-muted">{{ item.meta }}</span>
          </a>
        </li>
      }
    </ul>
  } @else {
    <p class="text-muted">None recorded</p>
  }
</section>
