<app-detail-page
  entityLabel="person"
  listPath="/people"
  listLabel="people"
  [state]="detail.state()"
  [title]="person()?.name ?? ''"
  [subtitle]="subtitle()"
  [backQueryParams]="detail.backQueryParams()"
  (retry)="detail.retry()"
>
  @if (person()) {
    <app-attribute-grid [attributes]="attributes()" />
    <app-related-list heading="Films" [items]="films()" />
    <app-related-list heading="Starships" [items]="starships()" />
    <app-related-list heading="Vehicles" [items]="vehicles()" />
  }
</app-detail-page>
