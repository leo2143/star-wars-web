<app-detail-page
  entityLabel="vehicle"
  listPath="/vehicles"
  listLabel="vehicles"
  [state]="detail.state()"
  [title]="vehicle()?.name ?? ''"
  [subtitle]="subtitle()"
  [backQueryParams]="detail.backQueryParams()"
  (retry)="detail.retry()"
>
  @if (vehicle()) {
    <app-attribute-grid [attributes]="attributes()" />
    <app-related-list heading="Films" [items]="films()" />
  }
</app-detail-page>
